name: Build and release

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'releases' || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt -r requirements-dev.txt
      - name: Backend tests
        run: PYTHONPATH=backend python -m unittest discover -s backend -v
      - name: Release version tests
        run: python -m unittest discover -s tools -p test_release_version.py -v
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Validate backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Validate frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  publish:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      BACKEND_IMAGE: ghcr.io/meral-it/meyton-live-display-backend
      FRONTEND_IMAGE: ghcr.io/meral-it/meyton-live-display-frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Select version
        id: version
        run: |
          git fetch origin --tags
          python3 tools/release_version.py "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Reserve version for retry-safe publication
        if: steps.version.outputs.complete != 'true' && steps.version.outputs.reused != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: steps.version.outputs.complete != 'true'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.version.outputs.complete != 'true'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.version.outputs.complete != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Find already-published version images
        if: steps.version.outputs.complete != 'true'
        id: images
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for name in BACKEND FRONTEND; do
            variable="${name}_IMAGE"
            if docker buildx imagetools inspect "${!variable}:$VERSION" >/dev/null 2>&1; then
              echo "${name,,}=true" >> "$GITHUB_OUTPUT"
            fi
          done
      - name: Publish backend version
        if: steps.version.outputs.complete != 'true' && steps.images.outputs.backend != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=backend
      - name: Publish frontend version
        if: steps.version.outputs.complete != 'true' && steps.images.outputs.frontend != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=frontend
      - name: Update channel images
        if: steps.version.outputs.complete != 'true' && steps.version.outputs.promote == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          docker buildx imagetools create --tag "$BACKEND_IMAGE:$CHANNEL" "$BACKEND_IMAGE:$VERSION"
          docker buildx imagetools create --tag "$FRONTEND_IMAGE:$CHANNEL" "$FRONTEND_IMAGE:$VERSION"
      - name: Create GitHub release
        if: steps.version.outputs.complete != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PROMOTE: ${{ steps.version.outputs.promote }}
        run: |
          printf 'Container images (linux/amd64 and linux/arm64):\n\n- `%s:%s`\n- `%s:%s`\n\nCommit: `%s`\n' "$BACKEND_IMAGE" "$VERSION" "$FRONTEND_IMAGE" "$VERSION" "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"
          flags=(--latest=false)
          if [ "$GITHUB_REF_NAME" = develop ]; then
            flags+=(--prerelease)
          elif [ "$PROMOTE" = true ]; then
            flags=(--latest=true)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"

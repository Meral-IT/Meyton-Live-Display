name: meyton-live-display
services:
  worker:
    image: ghcr.io/meral-it/meyton-live-display-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SM_DB_HOST: ${SM_DB_HOST:?Set SM_DB_HOST in .env}
      SM_DB_USER: ${SM_DB_USER:?Set SM_DB_USER in .env}
      SM_DB_PASS: ${SM_DB_PASS:?Set SM_DB_PASS in .env}
      SM_DB_NAME: ${SM_DB_NAME:-SSMDB2}
      SM_DB_PORT: ${SM_DB_PORT:-3306}
      SM_SDF_ENABLED: ${SM_SDF_ENABLED:-true}
      SM_SMB_HOST: ${SM_SMB_HOST:-}
      SM_SMB_USER: ${SM_SMB_USER:-}
      SM_SMB_PASS: ${SM_SMB_PASS:-}
      SM_SMB_PORT: ${SM_SMB_PORT:-445}
      SM_SMB_SHARE: ${SM_SMB_SHARE:-xml_result}
      # Local SDF exports: set the host directory in .env and uncomment this plus the /sdf mount below.
      # SM_SDF_DIRECTORY: /sdf
      SM_TIMEZONE: ${SM_TIMEZONE:-Europe/Berlin}
      SM_SDF_TIMEZONE: ${SM_SDF_TIMEZONE-Europe/Berlin}
      SM_LANA_HOST: ${SM_LANA_HOST:-}
      SM_LANA_PORT: ${SM_LANA_PORT:-53088}
      SM_RETENTION_DAYS: ${SM_RETENTION_DAYS:-7}
      RESULT_DB_PATH: /results/results.sqlite3
      SETTINGS_PATH: /data/settings.json
      VIEWER_PRESENCE_PATH: /data/viewers.json
      RESOURCE_SAVER_STATUS_PATH: /results/resource-saver-status.json
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 3
    volumes:
      - results:/results
      - profiles:/data:ro
      # Read-only ShootMaster export directory; replaces SMB access when enabled above.
      # - type: bind
      #   source: ${SM_SDF_DIRECTORY:?Set SM_SDF_DIRECTORY to the host export directory in .env}
      #   target: /sdf
      #   read_only: true
      #   bind:
      #     create_host_path: false
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  backend:
    image: ghcr.io/meral-it/meyton-live-display-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SM_ADMIN_PASSWORD: ${SM_ADMIN_PASSWORD:?Set a unique SM_ADMIN_PASSWORD in .env}
      PROFILE_PATH: /data/profiles.json
      RESULT_DB_PATH: /results/results.sqlite3
      SETTINGS_PATH: /data/settings.json
      VIEWER_PRESENCE_PATH: /data/viewers.json
      RESOURCE_SAVER_STATUS_PATH: /results/resource-saver-status.json
    volumes:
      - profiles:/data
      - results:/results
    depends_on:
      worker:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  frontend:
    image: ghcr.io/meral-it/meyton-live-display-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      DISPLAY_ADDRESS: ${DISPLAY_ADDRESS:-localhost}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  results:
  profiles:
  caddy_data:
  caddy_config:

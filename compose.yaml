name: meyton-live-display
services:
  worker:
    image: meyton-live-display-python
    pull_policy: build
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SM_DB_HOST: ${SM_DB_HOST:?Set SM_DB_HOST in .env}
      SM_DB_USER: ${SM_DB_USER:?Set SM_DB_USER in .env}
      SM_DB_PASS: ${SM_DB_PASS:?Set SM_DB_PASS in .env}
      SM_DB_NAME: ${SM_DB_NAME:-SSMDB2}
      SM_DB_PORT: ${SM_DB_PORT:-3306}
      SM_SMB_HOST: ${SM_SMB_HOST:?Set SM_SMB_HOST in .env}
      SM_SMB_USER: ${SM_SMB_USER:?Set SM_SMB_USER in .env}
      SM_SMB_PASS: ${SM_SMB_PASS:?Set SM_SMB_PASS in .env}
      SM_SMB_PORT: ${SM_SMB_PORT:-445}
      SM_SMB_SHARE: ${SM_SMB_SHARE:-xml_result}
      SM_TIMEZONE: ${SM_TIMEZONE:-Europe/Berlin}
      SM_SDF_TIMEZONE: ${SM_SDF_TIMEZONE-Europe/Berlin}
      SM_LANA_HOST: ${SM_LANA_HOST:-}
      SM_LANA_PORT: ${SM_LANA_PORT:-53088}
      SM_RETENTION_DAYS: ${SM_RETENTION_DAYS:-7}
      RESULT_DB_PATH: /results/results.sqlite3
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 3
    volumes:
      - results:/results
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  backend:
    image: meyton-live-display-python
    pull_policy: never
    environment:
      SM_ADMIN_PASSWORD: ${SM_ADMIN_PASSWORD:?Set a unique SM_ADMIN_PASSWORD in .env}
      PROFILE_PATH: /data/profiles.json
      RESULT_DB_PATH: /results/results.sqlite3
    volumes:
      - profiles:/data
      - results:/results
    depends_on:
      worker:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      DISPLAY_ADDRESS: ${DISPLAY_ADDRESS:-localhost}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  results:
  profiles:
  caddy_data:
  caddy_config:
